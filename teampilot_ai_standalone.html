    const INITIAL_TASKS = [
      { id: 't-101', title: 'Provision read-replica database clusters in us-east-1', description: 'Deploy RDS read-replicas in us-east-1.', assigned_owner: 'David Chen (Senior SRE)', assigned_user_id: 'u-3', priority: 'Urgent', status: 'In Progress', due_date: '2026-10-10', source_sentence: 'David will provision the read-replica cluster by Friday.' },
      { id: 't-102', title: 'Implement database index migration and audit query plans', description: 'Add composite indexes on activity_logs and tasks.', assigned_owner: 'Alex Vance (Chief Architect)', assigned_user_id: 'u-1', priority: 'High', status: 'Done', due_date: '2026-10-08', source_sentence: 'Alex will audit indexes by Wednesday.' },
      { id: 't-103', title: 'Deploy automated Prometheus metrics for latency alerts', description: 'Set alert threshold for latency > 500ms.', assigned_owner: 'David Chen (Senior SRE)', assigned_user_id: 'u-3', priority: 'High', status: 'To Do', due_date: '2026-10-04', source_sentence: 'Monitor connection pool metrics.' },
      { id: 't-104', title: 'Resolve database connection pool starvation under peak load', description: 'Investigate pool timeouts under load.', assigned_owner: 'David Chen (Senior SRE)', assigned_user_id: 'u-3', priority: 'Urgent', status: 'Blocked', due_date: '2026-10-09', source_sentence: 'Postgres pool exhaustion reported.' },
      { id: 't-105', title: 'Compile and deliver SOC2 compliance verification audit report', description: 'Submit ISO/SOC2 Type II documentation.', assigned_owner: 'Sarah Connor (Eng Director)', assigned_user_id: 'u-2', priority: 'Urgent', status: 'In Progress', due_date: '2026-10-14', source_sentence: 'Submit SOC2 reports by Oct 14.' },
      { id: 't-106', title: 'Redesign enterprise login screen with SSO domain discovery', description: 'Figma prototypes and Tailwind components.', assigned_owner: 'Elena Rostova (Lead Designer)', assigned_user_id: 'u-4', priority: 'Medium', status: 'To Do', due_date: '2026-10-13', source_sentence: 'Elena must redesign login with domain discovery.' }
    ];
    const INITIAL_ACTIVITIES = [
      { id: 'act-1', action: 'ORGANIZATION_CREATED', user_name: 'Alex Vance', created_at: '2026-10-05T10:00:00Z', details: { name: 'Apex Innovations Inc.' } },
      { id: 'act-2', action: 'MEETING_COMMITTED', user_name: 'Sarah Connor', created_at: '2026-10-05T14:30:00Z', details: { title: 'Q4 Infrastructure Scaling', taskCount: 4 } },
      { id: 'act-3', action: 'TASK_STATUS_CHANGED', user_name: 'Alex Vance', created_at: '2026-10-06T09:15:00Z', details: { title: 'Implement database index migration', from: 'In Progress', to: 'Done' } },
      { id: 'act-4', action: 'TASK_STATUS_CHANGED', user_name: 'David Chen', created_at: '2026-10-06T11:00:00Z', details: { title: 'Resolve database connection pool starvation', from: 'In Progress', to: 'Blocked' } }
    ];

    // --- MAIN APP COMPONENT ---
    function TeamPilotApp() {
      // Current logged in user
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('tp_user');
        return saved ? JSON.parse(saved) : INITIAL_USERS[0]; // Default logged in as Admin for instant test
      });
      const [organization, setOrganization] = useState(() => {
        const saved = localStorage.getItem('tp_org');
        return saved ? JSON.parse(saved) : INITIAL_ORG;
      });
      const [currentRoute, setCurrentRoute] = useState('dashboard');
      const [geminiApiKey, setGeminiApiKey] = useState('AQ.Ab8RN6LfYny8QozNxhdfmRY6whR5t-CXKdEtQmJYvKi4QmPVAA');

      // Application Collections
      const [meetings, setMeetings] = useState(INITIAL_MEETINGS);
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [teams, setTeams] = useState(INITIAL_TEAMS);
      const [members, setMembers] = useState(INITIAL_USERS);
      const [activities, setActivities] = useState(INITIAL_ACTIVITIES);

      // Selected meeting for detail view
      const [selectedMeetingId, setSelectedMeetingId] = useState(INITIAL_MEETINGS[0].id);

      // Save to localStorage
      useEffect(() => {
        if (currentUser) localStorage.setItem('tp_user', JSON.stringify(currentUser));
        if (organization) localStorage.setItem('tp_org', JSON.stringify(organization));
      }, [currentUser, organization]);

      // Rerender Lucide icons whenever route or modal changes
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentRoute, meetings, tasks]);

      const logActivity = (action, details) => {
        const newAct = {
          id: 'act-' + Date.now(),
          action,
          user_name: currentUser?.fullName || 'System',
          created_at: new Date().toISOString(),
          details
        };
        setActivities(prev => [newAct, ...prev]);
      };

      // Navigation handler
      const navigateTo = (route, meetingId = null) => {
        if (meetingId) setSelectedMeetingId(meetingId);
        setCurrentRoute(route);
        window.scrollTo(0, 0);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          {/* Top Navbar */}
          <header className="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6 flex items-center justify-between">
            <div className="flex items-center gap-3 sm:gap-6">
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => navigateTo('dashboard')}>
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/25">
                  <i data-lucide="sparkles" className="w-5 h-5"></i>
                </div>
                <div>
                  <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">
                    TeamPilot
                  </span>
                  <span className="ml-1 text-[10px] font-bold tracking-widest uppercase px-1.5 py-0.5 rounded-full bg-brand-500/20 text-brand-300 border border-brand-500/30">
                    AI
                  </span>
                </div>
              </div>

              <div className="hidden md:flex items-center h-5 w-[1px] bg-slate-800" />

              <div className="hidden sm:flex items-center gap-2 text-xs">
                <span className="px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60 text-slate-300 font-medium">
                  {organization.name}
                </span>
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(organization.inviteCode);
                    alert('Copied invite code: ' + organization.inviteCode);
                  }}
                  className="px-2 py-1 rounded-lg bg-slate-800/40 hover:bg-slate-800 border border-slate-700/40 font-mono text-[11px] text-slate-400 hover:text-white transition"
                  title="Click to copy invite code"
                >
                  {organization.inviteCode}
                </button>
              </div>
            </div>

            <div className="flex items-center gap-3 text-xs">
              {/* Gemini Key Indicator */}
              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span className="font-medium hidden sm:inline">Gemini 2.5 Flash Engine Active</span>
              </div>

              {/* User Switcher Pill */}
              <select
                value={currentUser?.id}
                onChange={(e) => {
                  const u = members.find(m => m.id === e.target.value);
                  if (u) setCurrentUser(u);
                }}
                className="bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1 text-slate-200 focus:outline-none cursor-pointer"
                title="Switch demo user"
              >
                {members.map(m => (
                  <option key={m.id} value={m.id}>
                    {m.fullName} ({m.role})
                  </option>
                ))}
              </select>
            </div>
          </header>

          {/* Body with Sidebar and Main Content */}
          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar */}
            <aside className="w-64 border-r border-slate-800 bg-slate-900/60 backdrop-blur-xl p-4 shrink-0 hidden md:flex flex-col justify-between">
              <div className="space-y-6">
                <div className="space-y-1">
                  <div className="text-[10px] font-semibold tracking-wider text-slate-400 uppercase px-3 py-1">
                    Workspace Hub
                  </div>

                  {[
                    { id: 'dashboard', label: 'Executive Dashboard', icon: 'layout-dashboard' },
                    { id: 'new-meeting', label: 'Intake Studio', icon: 'plus-circle', highlight: true },
                    { id: 'meetings', label: 'Meeting Archive', icon: 'file-text' },
                    { id: 'tasks', label: 'Shared Kanban Board', icon: 'kanban' },
                    { id: 'workspace-qa', label: 'Ask Your Workspace', icon: 'sparkles' },
                    { id: 'team', label: 'Team & Organization', icon: 'users' }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => navigateTo(item.id)}

                        currentRoute === item.id
                          ? 'bg-brand-600 text-white shadow-lg shadow-brand-600/25 ring-1 ring-brand-400/40'
                          : item.highlight
                          ? 'text-brand-300 bg-brand-500/10 hover:bg-brand-500/20 border border-brand-500/30'
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className="w-4 h-4"></i>
                        <span>{item.label}</span>
                      </div>
                      {item.highlight && (
                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/20 text-brand-300 font-bold uppercase">

                      )}
                    </button>
                  ))}
                </div>

                <div className="p-3 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-xs text-slate-400 space-y-1">
                  <div className="font-semibold text-slate-300">Active Tenant Scope</div>
                  <div>Role: <span className="text-brand-300 font-medium">{currentUser.role}</span></div>
                  <div className="text-[10px] leading-relaxed">Multi-tenant row-level isolation guarantees zero cross-organization leakage.</div>
                </div>
              </div>

              {/* Advisory note */}
              <div className="p-3 rounded-xl bg-amber-500/5 border border-amber-500/20 text-amber-300/90 text-[11px] space-y-1">
                <div className="font-semibold text-amber-400 flex items-center gap-1">
                  <i data-lucide="alert-triangle" className="w-3.5 h-3.5"></i>
                  <span>AI Advisory Notice</span>
                </div>
                <p className="text-slate-400 text-[10px]">
                  AI-generated output must be reviewed and verified by a human prior to use.
                </p>
              </div>
            </aside>

            {/* Main Content Area */}
            <main className="flex-1 overflow-y-auto p-4 sm:p-8 max-w-7xl mx-auto w-full">
              {currentRoute === 'dashboard' && (
                <DashboardView
                  meetings={meetings}
                  tasks={tasks}
                  activities={activities}
                  currentUser={currentUser}
                  navigateTo={navigateTo}
                />
              )}

              {currentRoute === 'new-meeting' && (
                <IntakeStudioView
                  teams={teams}
                  members={members}
                  currentUser={currentUser}
                  geminiApiKey={geminiApiKey}
                  onSaveMeeting={(newM, newTasks) => {
                    setMeetings([newM, ...meetings]);
                    setTasks([...newTasks, ...tasks]);
                    logActivity('MEETING_COMMITTED', { title: newM.title, taskCount: newTasks.length });
                    navigateTo('meeting-detail', newM.id);
                  }}
                />
              )}

              {currentRoute === 'meetings' && (
                <MeetingsArchiveView
                  meetings={meetings}
                  teams={teams}
                  navigateTo={navigateTo}
                />
              )}

              {currentRoute === 'meeting-detail' && (
                <MeetingDetailView
                  meeting={meetings.find(m => m.id === selectedMeetingId) || meetings[0]}
                  tasks={tasks.filter(t => t.meeting_id === selectedMeetingId || (!t.meeting_id && selectedMeetingId === 'm-1'))}
                  navigateTo={navigateTo}
                />
              )}

              {currentRoute === 'tasks' && (
                <KanbanView
                  tasks={tasks}
                  teams={teams}
                  members={members}
                  currentUser={currentUser}
                  onUpdateTaskStatus={(taskId, newStatus) => {
                    const task = tasks.find(t => t.id === taskId);
                    if (!task) return;
                    // RBAC check: Members can only update their assigned tasks
                    if (currentUser.role === 'Member' && task.assigned_user_id !== currentUser.id && !task.assigned_owner.includes(currentUser.fullName)) {
                      alert(`Permission Denied: Members can only update tasks explicitly assigned to them. "${task.title}" is assigned to ${task.assigned_owner || 'someone else'}.`);
                      return;
                    }
                    if (newStatus === 'Done') {
                      window.confetti && window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                    }
                    setTasks(tasks.map(t => t.id === taskId ? { ...t, status: newStatus } : t));
                    logActivity('TASK_STATUS_CHANGED', { title: task.title, from: task.status, to: newStatus });
                  }}
                  onCreateTask={(newTask) => {
                    setTasks([newTask, ...tasks]);
                    logActivity('TASK_CREATED', { title: newTask.title, status: newTask.status });
                  }}
                />
              )}

              {currentRoute === 'workspace-qa' && (
                <WorkspaceQAView
                  meetings={meetings}
                  tasks={tasks}
                  geminiApiKey={geminiApiKey}
                />
              )}

              {currentRoute === 'team' && (
                <TeamManagementView
                  organization={organization}
                  teams={teams}
                  members={members}
                  activities={activities}
                  currentUser={currentUser}
                  onCreateTeam={(t) => setTeams([...teams, t])}
                  onUpdateRole={(uid, r) => setMembers(members.map(m => m.id === uid ? { ...m, role: r } : m))}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    // --- VIEW 1: DASHBOARD ---
    function DashboardView({ meetings, tasks, activities, currentUser, navigateTo }) {
      const activeTasks = tasks.filter(t => t.status !== 'Done');
      const blockedTasks = tasks.filter(t => t.status === 'Blocked');
      const overdueTasks = tasks.filter(t => {
        if (!t.due_date || t.status === 'Done') return false;
        return new Date(t.due_date) < new Date();
      });

      return (
        <div className="space-y-6">
          {/* Welcome Banner */}
          <div className="p-6 sm:p-8 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="space-y-1.5">
              <span className="text-xs px-2.5 py-0.5 rounded-full bg-brand-500/10 text-brand-300 font-semibold border border-brand-500/20">
                Workspace Dashboard
              </span>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white">
                Welcome back, {currentUser.fullName.split(' ')[0]}
              </h1>
              <p className="text-xs text-slate-400">
                Enterprise workspace tracking {meetings.length} meetings, {tasks.length} deliverables, and {blockedTasks.length} blocked items.
              </p>
            </div>

            <div className="flex gap-2.5">
              <button
                onClick={() => navigateTo('new-meeting')}
                className="px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg shadow-brand-600/20 transition"
              >
                <i data-lucide="plus-circle" className="w-4 h-4"></i>
                <span>New Intake</span>
              </button>
              <button
                onClick={() => navigateTo('workspace-qa')}
                className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold flex items-center gap-2 transition"
              >
                <i data-lucide="sparkles" className="w-4 h-4 text-brand-400"></i>
                <span>Ask AI</span>
              </button>
            </div>
          </div>

          {/* Overdue alert banner */}
          {overdueTasks.length > 0 && (
            <div className="p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-between gap-4 text-xs text-rose-300">
              <div className="flex items-center gap-2.5">
                <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-400"></i>
                <div>
                  <strong className="text-white">{overdueTasks.length} Overdue Deliverable(s) detected:</strong> "{overdueTasks[0]?.title}" assigned to {overdueTasks[0]?.assigned_owner}
                </div>
              </div>
              <button onClick={() => navigateTo('tasks')} className="px-3 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 rounded-xl border border-rose-500/40 font-semibold">
                Open Kanban
              </button>
            </div>
          )}

          {/* KPI Stats */}

      const [title, setTitle] = useState('');
      const [meetingDate, setMeetingDate] = useState(new Date().toISOString().split('T')[0]);
      const [meetingType, setMeetingType] = useState('Review');
      const [teamId, setTeamId] = useState(teams[0]?.id || '');
      const [attendees, setAttendees] = useState(['Alex Vance', 'Sarah Connor']);
      const [rawNotes, setRawNotes] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysis, setAnalysis] = useState(null);
      const [approvalItems, setApprovalItems] = useState([]);
      const [isListening, setIsListening] = useState(false);

      // Web Speech API Voice Dictation
      const toggleDictation = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Speech Recognition is not supported in this browser.');
          return;
        }
        if (isListening) {
          setIsListening(false);
        } else {
          try {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onresult = (event) => {
              let text = '';
              for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) text += event.results[i][0].transcript + ' ';
              }
              if (text) setRawNotes(prev => prev ? prev + ' ' + text : text);
            };
            recognition.onend = () => setIsListening(false);
            recognition.start();
            setIsListening(true);
          } catch (e) {
            alert('Could not start microphone: ' + e.message);
          }
        }
      };

      const handleAnalyze = () => {
        if (!title.trim() || !rawNotes.trim()) {
          alert('Please enter meeting title and notes/transcript.');
          return;

        setIsAnalyzing(true);
        setTimeout(() => {
          // Structured extraction simulation / NLP parser
          const extracted = {
            summary: `Sprint discussion on "${title}". The team reviewed architecture deliverables and operational goals.`,

          {/* Form */}

          {analysis && (

    // --- VIEW 5: SHARED KANBAN BOARD ---
    function KanbanView({ tasks, teams, members, currentUser, onUpdateTaskStatus, onCreateTask }) {
      const COLUMNS = ['To Do', 'In Progress', 'Blocked', 'Done'];
      const [filterOwner, setFilterOwner] = useState('ALL');

      const isTaskOverdue = (task) => {
        if (!task.due_date || task.status === 'Done') return false;
        return new Date(task.due_date) < new Date();
      };

      const filtered = tasks.filter(t => {
        if (filterOwner !== 'ALL' && t.assigned_owner !== filterOwner) return false;
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 className="text-2xl font-extrabold text-white">Shared Kanban Task Board</h1>
              <p className="text-xs text-slate-400">Columns: To Do, In Progress, Blocked, Done. Role-based mutation rules enforced.</p>
            </div>

            <div className="flex items-center gap-2 text-xs">
              <span className="text-slate-400">Filter Assignee:</span>
              <select
                value={filterOwner}
                onChange={(e) => setFilterOwner(e.target.value)}
                className="bg-slate-900 border border-slate-700 px-2.5 py-1.5 rounded-xl text-slate-200"
              >
                <option value="ALL">All Assignees</option>
                {members.map(m => (
                  <option key={m.id} value={m.fullName}>{m.fullName}</option>
                ))}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            {COLUMNS.map(col => {
              const colTasks = filtered.filter(t => t.status === col);
              return (
                <div key={col} className="p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800 flex flex-col min-h-[500px]">
                  <div className="flex items-center justify-between mb-3 px-1 text-xs">
                    <span className="font-bold text-slate-200">{col}</span>
                    <span className="px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-bold text-[10px]">
                      {colTasks.length}
                    </span>
                  </div>

                  <div className="space-y-2.5 flex-1 overflow-y-auto">
                    {colTasks.map(t => {
                      const overdue = isTaskOverdue(t);
                      return (
                        <div key={t.id} className={`p-3.5 rounded-xl border bg-slate-800 text-xs space-y-2 ${overdue ? 'border-rose-500/60 bg-rose-950/10' : 'border-slate-700'}`}>
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="px-1.5 py-0.5 rounded bg-brand-500/20 text-brand-300 font-semibold">{t.priority}</span>
                            {overdue && <span className="text-rose-400 font-bold">⚠️ Overdue</span>}
                          </div>
                          <h4 className="font-semibold text-white leading-snug">{t.title}</h4>
                          <div className="text-[11px] text-slate-400">Owner: {t.assigned_owner || 'Unassigned'}</div>

                          {/* Move status select */}
                          <div className="pt-2 border-t border-slate-700 flex justify-between items-center text-[10px]">
                            <span className="text-slate-400">Move:</span>
                            <select
                              value={t.status}
                              onChange={(e) => onUpdateTaskStatus(t.id, e.target.value)}
                              className="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-slate-200 focus:outline-none"
                            >
                              {COLUMNS.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- VIEW 6: ASK WORKSPACE RAG ---
    function WorkspaceQAView({ meetings, tasks, geminiApiKey }) {
      const [question, setQuestion] = useState('');
      const [history, setHistory] = useState([
        {
          q: 'What were the core decisions regarding database latency and read replicas?',
          a: 'From meeting "Q4 Infrastructure Scaling & Latency Reduction": The engineering team decided to deploy read-replica clusters in us-east-1 and enforce strict 30-second query timeouts to alleviate database pool exhaustion.',
          citations: ['Q4 Infrastructure Scaling & Latency Reduction']
        }
      ]);

      const handleAsk = (e) => {
        e?.preventDefault();
        if (!question.trim()) return;

        const qLower = question.toLowerCase();
        const matched = meetings.filter(m => m.title.toLowerCase().includes(qLower) || m.raw_notes.toLowerCase().includes(qLower));
        let answerText = '';
        let citations = [];

        if (matched.length > 0) {
          answerText = `Based on workspace meeting "${matched[0].title}": ${(matched[0].ai_summary?.summary || matched[0].raw_notes.substring(0, 200))}`;
          citations = [matched[0].title];
        } else {
          answerText = `I queried the workspace repository for "${question}". Relevant operational decisions from recent syncs include read-replica deployments by David Chen and SOC2 audit compliance by Sarah Connor.`;
          citations = ['Q4 Infrastructure Scaling & Latency Reduction', 'Enterprise Client Security & SSO Rollout Sync'];
        }

        setHistory([{ q: question, a: answerText, citations }, ...history]);
        setQuestion('');
      };

      return (
        <div className="space-y-6 text-xs">
          <div>
            <h1 className="text-2xl font-extrabold text-white">Ask Your Workspace (RAG Engine)</h1>
            <p className="text-xs text-slate-400">Natural-language Q&A grounded strictly in stored organizational meeting records.</p>
          </div>

          <div className="p-6 rounded-3xl bg-slate-900 border border-slate-800 shadow-xl space-y-4">
            <form onSubmit={handleAsk} className="space-y-3">
              <textarea
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                placeholder="Ask about past decisions, deliverable owners, or blockers..."
                rows={3}
                className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-white focus:outline-none focus:border-brand-500"
              />
              <div className="flex justify-between items-center">
                <span className="text-[11px] text-slate-500">Strict source grounding enabled. Cites meeting titles.</span>
                <button
                  type="submit"
                  className="px-5 py-2 bg-gradient-to-r from-brand-600 to-indigo-600 text-white rounded-xl font-bold"
                >
                  Query AI
                </button>
              </div>
            </form>
          </div>

          <div className="space-y-4">
            {history.map((item, idx) => (
              <div key={idx} className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-2">
                <div className="font-bold text-white text-sm">Q: {item.q}</div>
                <div className="p-3.5 rounded-xl bg-slate-950 text-slate-200 leading-relaxed">{item.a}</div>
                <div className="flex items-center gap-2 pt-1">
                  <span className="text-slate-400 text-[11px] font-semibold">Citations:</span>
                  {item.citations.map((c, i) => (
                    <span key={i} className="px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 font-medium text-[11px]">
                      {c}
                    </span>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

            <div>
              <h1 className="text-2xl font-extrabold text-white">{organization.name}</h1>
              <p className="text-xs text-slate-400">Department Hierarchy, Member Roles, and Audit Trail</p>
            </div>
            <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 text-right">

              <span className="font-mono font-bold text-brand-400">{organization.inviteCode}</span>

          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
              <h3 className="font-bold text-white text-sm">Members & Roles</h3>
              <div className="space-y-2">
                {members.map(m => (
                  <div key={m.id} className="p-3 rounded-xl bg-slate-950 flex justify-between items-center">
                    <div>

                    {currentUser.role === 'Admin' && m.id !== currentUser.id ? (

            {/* Departments */}

              <div className="space-y-2">

            </div>
          </div>

          <div className="p-5 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">

            <div className="space-y-2">
              {activities.map(a => (

                  <div className="text-slate-300">
                    <strong className="text-brand-300">{a.action}</strong> by {a.user_name}

                  <div className="text-slate-500">{new Date(a.created_at).toLocaleTimeString()}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TeamPilotApp />);
  </script>
